    <rect x="78" y="177" width="72" height="4" rx="2" fill="url(#accent)"/>
    <text x="78" y="220" fill="#cbd5e1" font-size="20" letter-spacing="1.5">CYBERSECURITY  ·  PENETRATION TESTING  ·  NETWORK SECURITY</text>
    <text x="78" y="252" fill="#64748b" font-size="12" letter-spacing="2">BUILD / TEST / DOCUMENT / IMPROVE</text>
