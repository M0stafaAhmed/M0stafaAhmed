<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Ahmed — Cybersecurity Engineer</title>
  <desc id="desc">A dark technical banner with a violet and cyan network motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080d1b"/>
      <stop offset=".55" stop-color="#111a32"/>
      <stop offset="1" stop-color="#10102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".35"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#94a3b8" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="280" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="280" rx="24" fill="url(#grid)"/>
  <ellipse cx="1030" cy="70" rx="310" ry="210" fill="url(#glow)"/>
  <g fill="none" stroke="url(#accent)" stroke-opacity=".62" stroke-width="1.6">
    <path d="M820 0L930 70L1035 40L1145 110L1200 82"/>
    <path d="M840 280L940 205L1040 232L1130 155L1200 180"/>
    <path d="M945 70L945 205M1035 40L1040 232M1145 110L1130 155"/>
    <path d="M850 140L945 70L1035 40M850 140L940 205L1040 232"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="930" cy="70" r="4"/><circle cx="1035" cy="40" r="4"/>
    <circle cx="1145" cy="110" r="4"/><circle cx="940" cy="205" r="4"/>
    <circle cx="1040" cy="232" r="4"/><circle cx="1130" cy="155" r="4"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="75" fill="#a5b4fc" font-size="15" letter-spacing="4">PORTFOLIO / 01</text>
