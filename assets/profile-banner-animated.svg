<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Ahmed — Cybersecurity Engineer</title>
  <desc id="desc">A dark violet and cyan cybersecurity banner with glowing network paths, moving signal lights, and subtle animated star particles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset=".52" stop-color="#101a31"/>
      <stop offset="1" stop-color="#10102a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#22d3ee;#8b5cf6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a78bfa;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="violetGlow">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".36"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#94a3b8" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="1040" cy="88" rx="330" ry="230" fill="url(#violetGlow)">
    <animate attributeName="opacity" values=".65;1;.65" dur="7s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="900" cy="260" rx="230" ry="150" fill="url(#cyanGlow)">
    <animate attributeName="opacity" values=".45;.9;.45" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Network topology -->
  <g fill="none" stroke="url(#accent)" stroke-width="1.7" stroke-opacity=".54">
    <path d="M805 0L900 62L1012 30L1112 104L1200 66"/>
    <path d="M785 320L900 235L1015 265L1115 190L1200 220"/>
    <path d="M900 62L900 235M1012 30L1015 265M1112 104L1115 190"/>
    <path d="M760 155L900 62L1012 30M760 155L900 235L1015 265"/>
    <path d="M945 0L1012 30L1068 0M1112 104L1170 145L1200 136"/>
  </g>

  <!-- Flowing network signals -->
  <g fill="none" stroke="#67e8f9" stroke-width="2.6" stroke-linecap="round" filter="url(#softGlow)">
    <path d="M805 0L900 62L1012 30L1112 104L1200 66" stroke-dasharray="16 390" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-406" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".1;.9;.1" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M785 320L900 235L1015 265L1115 190L1200 220" stroke-dasharray="12 420" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" from="0" to="-432" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".08;.7;.08" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Network nodes -->
  <g fill="#22d3ee" filter="url(#softGlow)">
    <circle cx="900" cy="62" r="4"><animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1012" cy="30" r="4"><animate attributeName="r" values="4;6;4" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="104" r="4"><animate attributeName="r" values="3;5;3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="235" r="4"><animate attributeName="r" values="4;6;4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="1015" cy="265" r="4"><animate attributeName="r" values="3;5;3" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="1115" cy="190" r="4"><animate attributeName="r" values="4;6;4" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="155" r="4"/>
  </g>

  <!-- Moving signal light -->
  <circle r="6" fill="#a5f3fc" filter="url(#softGlow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M760 155L900 62L1012 30L1112 104L1200 66"/>
  </circle>
  <circle r="4" fill="#c4b5fd" filter="url(#softGlow)">
    <animateMotion dur="10s" repeatCount="indefinite" path="M785 320L900 235L1015 265L1115 190L1200 220"/>
  </circle>

  <!-- Twinkling particles -->
  <g fill="#dbeafe">
    <circle cx="842" cy="82" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="965" cy="118" r="1.8"><animate attributeName="opacity" values="1;.15;1" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="72" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="1160" cy="145" r="1.8"><animate attributeName="opacity" values=".15;1;.15" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="246" r="1.7"><animate attributeName="opacity" values="1;.1;1" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="970" cy="286" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1082" cy="236" r="1.8"><animate attributeName="opacity" values="1;.12;1" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="1172" cy="275" r="2"><animate attributeName="opacity" values=".1;1;.1" dur="3.2s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Typography -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="78" y="72" fill="#a5b4fc" font-size="15" letter-spacing="4">PORTFOLIO / 01</text>
    <text x="74" y="151" fill="#f8fafc" font-size="62" font-weight="700" letter-spacing="-2">MOSTAFA AHMED</text>
    <rect x="78" y="177" width="86" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="86;150;86" dur="5s" repeatCount="indefinite"/>
    </rect>
    <text x="78" y="220" fill="#cbd5e1" font-size="18" letter-spacing="1">CYBERSECURITY · PENETRATION TESTING</text>
    <text x="78" y="251" fill="#94a3b8" font-size="15" letter-spacing="1">NETWORK SECURITY · SYSTEMS · AUTOMATION</text>
    <text x="78" y="289" fill="#64748b" font-size="12" letter-spacing="2">BUILD / TEST / DOCUMENT / IMPROVE</text>
  </g>
</svg>
