<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Mostafa Ahmed — Signal / Evidence</title>
  <desc id="desc">Dark navy cybersecurity portfolio banner with violet and cyan signals on the right; the name Mostafa Ahmed and penetration testing specialties on the left. The name reveals once quickly, then stays in position as the light and glow smoothly pulse from full to half brightness and back; the specialties and network signals animate separately.</desc>
  <style>
    @media (prefers-reduced-motion: reduce) {
      .secondary-line { opacity: 0 !important; }
      .primary-line { opacity: 1 !important; }
      .motion { display: none !important; }
      [filter="url(#nameGlow)"] { opacity: 0 !important; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B16"/>
      <stop offset=".58" stop-color="#101A2E"/>
      <stop offset="1" stop-color="#171028"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset=".65" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#94A3B8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
    <filter id="nameGlow" x="-30%" y="-80%" width="160%" height="260%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="nameReveal">
      <rect x="65" y="90" width="636" height="85"><animate class="motion" attributeName="width" values="0;636;636" keyTimes="0;0.75;1" dur="2.3s" repeatCount="1" fill="freeze"/></rect>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <ellipse cx="1020" cy="140" rx="345" ry="246" fill="url(#glow)"/>
  <rect x="0" y="0" width="10" height="320" fill="url(#signal)"/>

  <g fill="none" stroke="url(#signal)" stroke-width="1.6" stroke-opacity=".52">
    <path d="M795 46L870 105L970 55L1070 110L1170 69L1200 95"/>
    <path d="M790 264L881 213L974 257L1066 195L1175 244L1200 221"/>
    <path d="M870 105L881 213M970 55L974 257M1070 110L1066 195M1170 69L1175 244"/>
    <path d="M755 170L870 105L970 55M755 170L881 213L974 257"/>
  </g>
  <g fill="#67E8F9">
    <circle cx="795" cy="46" r="3.2"/><circle cx="870" cy="105" r="4.3"/><circle cx="970" cy="55" r="4.8"/>
    <circle cx="1070" cy="110" r="3.5"/><circle cx="1170" cy="69" r="4.3"/>
  </g>
  <g fill="#A78BFA">
    <circle cx="790" cy="264" r="3.2"/><circle cx="881" cy="213" r="4.5"/><circle cx="974" cy="257" r="4.8"/>
    <circle cx="1066" cy="195" r="4.7"/><circle cx="1175" cy="244" r="3.5"/>
  </g>
  <!-- Subtle movement: decorative only, with a static counterpart and reduced-motion selection in README. -->
  <g class="motion" fill="none" stroke-linecap="round">
    <path d="M795 46L870 105L970 55L1070 110L1170 69" stroke="#67E8F9" stroke-width="3.4" stroke-dasharray="14 400">
      <animate attributeName="stroke-dashoffset" values="0;-414" dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M790 264L881 213L974 257L1066 195L1175 244" stroke="#A78BFA" stroke-width="3.2" stroke-dasharray="12 400">
      <animate attributeName="stroke-dashoffset" values="0;-412" dur="9s" repeatCount="indefinite"/>
    </path>
    <circle cx="970" cy="55" r="6" fill="#67E8F9" fill-opacity=".34">
      <animate attributeName="r" values="5;15;5" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".40;.04;.40" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1066" cy="195" r="6" fill="#C4B5FD" fill-opacity=".33">
      <animate attributeName="r" values="5;15;5" dur="4.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values=".38;.04;.38" dur="4.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="72" y="58" font-size="14" font-weight="600" letter-spacing="3" fill="#A5B4FC">SIGNAL / EVIDENCE</text>
    <text x="1180" y="28" text-anchor="end" font-size="10" letter-spacing="1.8" fill="#9CA3AF">SECURITY ENGINEERING / 01</text>
    <g clip-path="url(#nameReveal)">
      <!-- One quick reveal; afterward stationary brightness + glow pulse only. -->
      <text x="69" y="160" font-size="61" font-weight="700" letter-spacing="-2" fill="#8DEDFB"
            filter="url(#nameGlow)" opacity=".42">MOSTAFA AHMED<animate class="motion" attributeName="opacity"
                 begin="2.3s" dur="6.4s" values=".42;.07;.42"
                 keyTimes="0;.5;1" repeatCount="indefinite"/></text>
      <text x="69" y="160" font-size="61" font-weight="700" letter-spacing="-2"
            fill="#F8FAFC">MOSTAFA AHMED<animate class="motion" attributeName="opacity"
                 begin="2.3s" dur="6.4s" values="1;.5;1"
                 keyTimes="0;.5;1" repeatCount="indefinite"/></text>
    </g>
        <rect x="73" y="182" width="78" height="4" rx="2" fill="url(#signal)">
    <animate class="motion" attributeName="width" values="78;147;78" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <text class="primary-line" x="73" y="224" font-size="18" letter-spacing=".7" font-weight="600" fill="#67E8F9">PENETRATION TESTING / WEB &amp; API SECURITY<animate class="motion" attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.23;0.30;0.77;1" dur="13s" repeatCount="indefinite"/></text>
    <text class="secondary-line" x="73" y="224" font-size="18" letter-spacing=".7" font-weight="600" fill="#C4B5FD" opacity="0">SYSTEMS / AUTOMATION / EVIDENCE-FIRST<animate class="motion" attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.30;0.77;1" dur="13s" repeatCount="indefinite"/></text>
    <text x="96" y="268" font-size="13" letter-spacing="1.5" fill="#BAC9DF">BUILD WITH INTENT. TEST WITH EVIDENCE.</text>
    <rect x="73" y="256" width="12" height="15" fill="#10B981" opacity="1">
    <animate class="motion" attributeName="opacity" values="1;1;.1;.1;1" keyTimes="0;.48;.5;.85;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M72 290H1190" stroke="#334155" stroke-width="1" opacity=".7"/>
  <text x="74" y="306" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#8997AF">AUTHORIZED SECURITY RESEARCH</text>
  <text x="1180" y="306" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" fill="#8997AF">M0STAFA / GITHUB</text>
</svg>